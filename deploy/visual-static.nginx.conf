# 固定域名HTTPS由现有负载均衡终止，本机只恢复其80端口回源。
map $http_x_forwarded_proto $design_original_scheme {
    default $scheme;
    http http;
    https https;
}
# 文档导航进入登录页；图片、脚本与数据请求直接返回 401，避免把 HTML 当成资源。
map "$request_method:$http_sec_fetch_dest:$http_accept" $design_login_navigation {
    default 0;
    ~^(GET|HEAD):(document|iframe): 1;
    ~^(GET|HEAD):[^:]*:.*text/html 1;
}
server {
    listen 80;
    server_name gamedevcenter.ahagamecenter.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown;
    auth_request /_design_session_check;
    error_page 401 = @design_login_required;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    location = /_design_session_check {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $design_original_scheme;
    }
    location @design_login_required {
        auth_request off;
        if ($design_login_navigation) { return 302 /login?next=$request_uri; }
        return 401;
    }
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $design_original_scheme;
    }
    location /visual-workflow/ {
        # 静态交付缺文件时返回404，避免被Vue首页掩盖资源缺失。
        try_files $uri $uri/ =404;
    }
    location /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $design_original_scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
