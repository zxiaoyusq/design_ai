# 固定域名HTTPS由现有负载均衡终止，本机只恢复其80端口回源。
map $http_x_forwarded_proto $design_original_scheme {
    default $scheme;
    http http;
    https https;
}
server {
    listen 80;
    server_name gamedevcenter.ahagamecenter.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown;
    location /visual-workflow/ {
        # 静态交付缺文件时返回404，避免被Vue首页掩盖资源缺失。
        try_files $uri $uri/ =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $design_original_scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
