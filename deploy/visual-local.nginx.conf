# 仅监听服务器回环地址，通过SSH本地端口转发访问现有前端与图板。
map "$request_method:$http_sec_fetch_dest:$http_accept" $design_login_navigation {
    default 0;
    ~^(GET|HEAD):(document|iframe): 1;
    ~^(GET|HEAD):[^:]*:.*text/html 1;
}
server {
    listen 127.0.0.1:5174;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown;
    auth_request /_design_session_check;
    error_page 401 = @design_login_required;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    location = /_design_session_check {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @design_login_required {
        auth_request off;
        if ($design_login_navigation) { return 302 /login?next=$request_uri; }
        return 401;
    }
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /visual-workflow/ {
        # 保留独立交付页面的真实404，缺失资源不能回退到Vue首页。
        try_files $uri $uri/ =404;
    }
    location /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
